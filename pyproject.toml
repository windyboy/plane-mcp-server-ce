[project]
name = "plane-community-mcp"
version = "0.5.0"
description = "Community Edition and self-hosted focused MCP server for Plane"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name= "Surya Prashanth", email = "surya.prashanth@plane.so"},
    {name = "Plane Engineering", email = "support@plane.so"},
    {name = "tancou", email = "commun@app.optimis.io"}
]
keywords = ["mcp", "plane", "fastmcp", "ai", "automation"]

dependencies = [
    "fastmcp==3.4.7",
    "plane-sdk==0.2.24",
    "py-key-value-aio[redis]>=0.4.4,<0.5.0",
    "mcp==1.26.0",
    "PyJWT>=2.12.0",
    "authlib>=1.6.9",
    "boto3>=1.34.0",
    # fakeredis cap: 2.35.0 removed `FakeConnection` from
    # `fakeredis.aioredis`, which pydocket (fastmcp's task runner) imports.
    "fakeredis[lua]>=2.32.1,<2.35.0",
]

[project.urls]
Homepage = "https://github.com/windyboy/plane-mcp-server-ce"
Repository = "https://github.com/windyboy/plane-mcp-server-ce"
Issues = "https://github.com/windyboy/plane-mcp-server-ce/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
plane-mcp-server-ce = "plane_mcp.__main__:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["plane_mcp*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Markdown reference tables in the PQL docstring cannot be wrapped without
# breaking their rendering.
"plane_mcp/tools/pql_reference.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
